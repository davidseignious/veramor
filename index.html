<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0910"><title>VERAMOR Admin</title><link rel="stylesheet" href="styles.css"></head><body><header class="top"><div><span class="brand">VERA<i>MOR</i></span> <span class="pill">ADMIN</span></div><span id="status" class="muted">Owner access</span></header><main class="wrap">
<section id="login" class="screen on"><div class="panel login"><span class="pill">OWNER ACCESS</span><h1>VERAMOR Admin</h1><p class="muted">Separate from dating accounts. This does not create a dating profile.</p><div id="loginMsg"></div><form id="loginForm"><div class="field"><label>Admin email</label><input id="email" type="email" value="ddseign@gmail.com" required></div><div class="field"><label>Admin password</label><input id="pass" type="password" required></div><button class="btn primary" style="width:100%">Open admin</button></form></div></section>
<section id="dashboard" class="screen"><div class="head"><div><span class="pill">OWNER DASHBOARD</span><h2 style="margin:8px 0 0">Live VERAMOR overview</h2></div><div class="actions"><button class="btn primary" id="previewBtn">Preview App</button><button class="btn" id="refreshBtn">Refresh</button><button class="btn danger" id="logoutBtn">Sign out</button></div></div><div id="dash"></div></section>
<section id="preview" class="screen"><div class="head"><div><span class="pill">SIMULATION ONLY</span><h2 style="margin:8px 0 0">Swipe preview</h2><p class="muted">Admin swipes never create real likes or messages.</p></div><button class="btn" id="back">Dashboard</button></div><div class="filters" id="gender"><button class="btn active" data-g="everyone">Everyone</button><button class="btn" data-g="men">Men</button><button class="btn" data-g="women">Women</button></div><div class="filters" id="mode" style="margin-top:8px"><button class="btn active" data-m="single">1-on-1</button><button class="btn" data-m="duo">2 Man</button><button class="btn" data-m="trio">Trio</button></div><div class="deck" id="deck"></div></section></main>
<div class="modal" id="profileModal"><div class="sheet"><button class="close" data-close="profileModal">×</button><span class="pill">FULL PROFILE</span><h2 id="fullName"></h2><div id="full"></div></div></div>
<div class="modal" id="matchModal"><div class="sheet" style="text-align:center"><button class="close" data-close="matchModal">×</button><div id="match"></div></div></div>
<script src="app.js"></script></body></html>
